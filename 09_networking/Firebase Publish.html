<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>🪴 amanda's desktop greenhouse 🪴</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* ---------- GLOBAL ---------- */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px 48px;
      font-family: "Courier New", Courier, monospace;
      color: #222;
      background-color: #fbf5e8;
      /* soft graph-paper grid */
      background-image:
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    h1 {
      font-size: 2.4rem;
      margin: 0 0 4px;
    }
    .subtitle {
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    a { color: inherit; }

    /* ---------- LAYOUT ---------- */
    .main-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)); /* water, lights, plant */
      gap: 24px;
      align-items: flex-start;
      position: relative;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      border: 2px solid #111;
      padding: 16px 18px 20px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
      position: relative;
      transition: box-shadow 0.15s ease;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      cursor: default;
    }
    .row {
      margin: 2px 0;
      font-size: 0.95rem;
    }
    .label { font-weight: 700; }
    .value { font-weight: 400; }

    .small { font-size: 0.8rem; }

    /* ---------- STICKIES ---------- */
    .sticky-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      align-items: flex-start;
    }
    .sticky-btn {
      width: 120px;
      height: 120px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, filter 0.15s ease;
      position: relative;
    }
    .sticky-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none; /* clicks handled on wrapper */
    }

    .sticky-btn.selected {
      filter: drop-shadow(0 0 8px rgba(249,176,73,0.9));
    }
    .sticky-btn.disabled {
      opacity: 0.35;
      filter: grayscale(60%);
      cursor: default;
      pointer-events: none;
    }

    /* click wiggle */
    .sticky-btn.wiggle {
      animation: stickyWiggle 0.15s ease;
    }
    @keyframes stickyWiggle {
      0%   { transform: translateY(0) rotate(0deg); }
      50%  { transform: translateY(3px) scale(0.98); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* ---------- STATE COLORS ---------- */
    .state-on  { color: #0c8a3d; font-weight: 700; }
    .state-off { color: #c0392b; font-weight: 700; }

    /* ---------- PLANT PANEL ---------- */
    .plant-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      padding-top: 12px;
      position: relative;
      transition: box-shadow 0.15s ease;
    }
    #plantWrapper {
      margin-top: 4px;
      width: 280px;
      height: 280px;
      position: relative;
      cursor: grab;  /* handle for dragging */
    }
    #plantWrapper.dragging {
      cursor: grabbing;
    }
    #plantImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.25s ease;
    }

    /* light and water overlays */

    /* Soft yellow sun glow */
    #lightEffect {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        circle at 50% -10%,
        rgba(255, 222, 150, 0.9),
        rgba(255, 222, 150, 0.4) 30%,
        rgba(255, 222, 150, 0.0) 70%
      );
      mix-blend-mode: screen;
    }

    /* 2D water: flat blue drops with simple outline */
    #waterEffect {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
    }
    #waterEffect .drop {
      position: absolute;
      width: 12px;
      height: 18px;
      border-radius: 50% 50% 60% 60%;
      background: #6bb8ff;
      border: 2px solid #1f6fbf;
      box-shadow: none;
      transform: translateY(0);
      opacity: 0;
    }
    #waterEffect .d1 { left: 40%; top: -12%; }
    #waterEffect .d2 { left: 55%; top: -18%; }
    #waterEffect .d3 { left: 30%; top: -8%; }

    /* sparkle overlay */
    #sparkleEffect {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95), transparent 55%),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,0.85), transparent 55%),
        radial-gradient(circle at 40% 70%, rgba(255,255,255,0.85), transparent 55%);
      mix-blend-mode: screen;
    }

    .light-anim {
      animation: lightFlash 0.8s ease-out;
    }
    .water-anim {
      animation: waterShow 0.8s linear;
    }
    .water-anim .drop {
      animation: dropFall 0.8s ease-in;
    }
    .sparkle-anim {
      animation: sparkleFlash 1s ease-out;
    }

    @keyframes lightFlash {
      0%   { opacity: 0; transform: translateY(-6px); }
      20%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes waterShow {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes dropFall {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translateY(170px); opacity: 0; }
    }
    @keyframes sparkleFlash {
      0%   { opacity: 0; }
      20%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ---------- DRAGGABLE CARDS ---------- */
    .draggable-handle {
      cursor: grab;
    }
    .dragging .draggable-handle {
      cursor: grabbing;
    }

    /* ---------- ORGANIZE BUTTON ---------- */
    .organize-btn {
      position: fixed;
      bottom: 14px;
      left: 16px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #111;
      background: rgba(255,255,255,0.95);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.18);
      cursor: pointer;
      z-index: 999;
    }
    .organize-btn:hover {
      transform: translateY(1px);
      box-shadow: 1px 1px 0 rgba(0,0,0,0.18);
    }

    @media (max-width: 1050px) {
      .main-grid {
        grid-template-columns: minmax(0,1fr);
      }
      .plant-panel {
        min-height: 340px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🪴 amanda's desktop greenhouse 🪴</h1>
  </header>
  <br>

  <main class="main-grid" id="mainGrid">
    <!-- ---------- WATER COLUMN ---------- -->
    <section class="card draggable" id="water-card">
      <h2 class="draggable-handle">💧 water! 💧</h2>
      <div class="row"><span class="label">mode:</span> <span id="pumpModeText" class="value">AUTO</span></div>
      <div class="row"><span class="label">state:</span> <span id="pumpStateText" class="value state-off">OFF</span></div>
      <div class="row"><span class="label">dryness:</span> <span id="drynessText" class="value">–%</span></div>

      <div class="row" style="margin-top:10px;"><u>mode</u></div>
      <div class="sticky-row">
        <div class="sticky-btn" id="pumpModeAutoBtn">
          <img src="PumpAuto.png" alt="Water AUTO sticky">
        </div>
        <div class="sticky-btn" id="pumpModeManualBtn">
          <img src="PumpManual.png" alt="Water MANUAL sticky">
        </div>
      </div>

      <div class="row" style="margin-top:14px;"><u>manual control</u></div>
      <div class="sticky-row">
        <div class="sticky-btn" id="pumpOnBtn">
          <img src="PumpOn.png" alt="Water ON sticky">
        </div>
        <div class="sticky-btn" id="pumpOffBtn">
          <img src="PumpOff.png" alt="Water OFF sticky">
        </div>
      </div>

    </section>

    <!-- ---------- LIGHTS COLUMN ---------- -->
    <section class="card draggable" id="lights-card">
      <h2 class="draggable-handle">💡 lights! 💡</h2>
      <div class="row"><span class="label">mode:</span> <span id="lightsModeText" class="value">AUTO</span></div>
      <div class="row"><span class="label">state:</span> <span id="lightsStateText" class="value state-off">OFF</span></div>
      <div class="row small">
        AUTO = on from 17:00 → 07:00
      </div>

      <div class="row" style="margin-top:10px;"><u>mode</u></div>
      <div class="sticky-row">
        <div class="sticky-btn" id="lightsModeAutoBtn">
          <img src="LightsAuto.png" alt="Lights AUTO sticky">
        </div>
        <div class="sticky-btn" id="lightsModeManualBtn">
          <img src="LightsManual.png" alt="Lights MANUAL sticky">
        </div>
      </div>

      <div class="row" style="margin-top:14px;"><u>manual control</u></div>
      <div class="sticky-row">
        <div class="sticky-btn" id="lightsOnBtn">
          <img src="LightsOn.png" alt="Lights ON sticky">
        </div>
        <div class="sticky-btn" id="lightsOffBtn">
          <img src="LightsOff.png" alt="Lights OFF sticky">
        </div>
      </div>

    </section>

    <!-- ---------- PLANT COLUMN (DRAGGABLE AS A UNIT, HANDLE = PLANT) ---------- -->
    <section class="plant-panel draggable" id="plant-panel">
      <div id="plantWrapper">
        <img id="plantImage" src="1.png" alt="Plant stage">
        <div id="lightEffect"></div>
        <div id="waterEffect">
          <div class="drop d1"></div>
          <div class="drop d2"></div>
          <div class="drop d3"></div>
        </div>
        <div id="sparkleEffect"></div>
      </div>
      <div class="row small" style="margin-top:10px; max-width:260px; text-align:center;">
        growth stage: <span id="plantLevel">1</span> / 10<br>
        grows whenever water or light turns <b>ON</b>.
        <a href="#" id="plantResetLink">reset plant</a>
      </div>
    </section>
  </main>

  <!-- organize me button -->
  <button class="organize-btn" id="organizeBtn">organize me</button>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/7.13.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.13.2/firebase-database.js"></script>

  <script>
    // ---------- FIREBASE INIT ----------
    var firebaseConfig = {
      apiKey: "AIzaSyAnMUmucc3e59XRT8SyUEI0sdq6PyPRTl0",
      authDomain: "watering-system-override.firebaseapp.com",
      databaseURL: "https://watering-system-override-default-rtdb.firebaseio.com",
      projectId: "watering-system-override",
      storageBucket: "watering-system-override.firebasestorage.app",
      messagingSenderId: "8484160068",
      appId: "1:8484160068:web:a3decbfbc160f699d3f211"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    // ---------- DOM ELEMENTS ----------
    var pumpModeText    = document.getElementById("pumpModeText");
    var pumpStateText   = document.getElementById("pumpStateText");
    var drynessText     = document.getElementById("drynessText");
    var lightsModeText  = document.getElementById("lightsModeText");
    var lightsStateText = document.getElementById("lightsStateText");

    var pumpModeAutoBtn   = document.getElementById("pumpModeAutoBtn");
    var pumpModeManualBtn = document.getElementById("pumpModeManualBtn");
    var pumpOnBtn         = document.getElementById("pumpOnBtn");
    var pumpOffBtn        = document.getElementById("pumpOffBtn");

    var lightsModeAutoBtn   = document.getElementById("lightsModeAutoBtn");
    var lightsModeManualBtn = document.getElementById("lightsModeManualBtn");
    var lightsOnBtn         = document.getElementById("lightsOnBtn");
    var lightsOffBtn        = document.getElementById("lightsOffBtn");

    // Plant elements
    var plantImgEl    = document.getElementById("plantImage");
    var plantLevelEl  = document.getElementById("plantLevel");
    var plantResetEl  = document.getElementById("plantResetLink");
    var lightFxEl     = document.getElementById("lightEffect");
    var waterFxEl     = document.getElementById("waterEffect");
    var sparkleEl     = document.getElementById("sparkleEffect");

    // ---------- DB REFS ----------
    var pumpModeRef    = db.ref("/pump/mode");
    var pumpStateRef   = db.ref("/pump/state");
    var pumpCmdRef     = db.ref("/pump/command");
    var drynessRef     = db.ref("/sensor/drynessPct");

    var lightsModeRef  = db.ref("/lights/mode");
    var lightsStateRef = db.ref("/lights/state");
    var lightsCmdRef   = db.ref("/lights/command");

    var plantLevelRef  = db.ref("/plant/level");

    // ---------- STICKY HELPERS ----------
    function addWiggle(btn) {
      btn.classList.remove("wiggle");
      void btn.offsetWidth;
      btn.classList.add("wiggle");
      setTimeout(function(){ btn.classList.remove("wiggle"); }, 160);
    }

    function randomTiltStickies() {
      var imgs = document.querySelectorAll(".sticky-btn img");
      imgs.forEach(function(img){
        var max = 5;
        var deg = (Math.random() * max * 2) - max;
        img.style.transform = "rotate(" + deg.toFixed(1) + "deg)";
      });
    }
    randomTiltStickies();

    // ---------- WATER (PUMP): CLICK HANDLERS ----------
    pumpModeAutoBtn.addEventListener("click", function(){
      pumpModeRef.set("AUTO");
      addWiggle(pumpModeAutoBtn);
    });
    pumpModeManualBtn.addEventListener("click", function(){
      pumpModeRef.set("MANUAL");
      addWiggle(pumpModeManualBtn);
    });
    pumpOnBtn.addEventListener("click", function(){
      pumpCmdRef.set("ON");
      addWiggle(pumpOnBtn);
    });
    pumpOffBtn.addEventListener("click", function(){
      pumpCmdRef.set("OFF");
      addWiggle(pumpOffBtn);
    });

    // ---------- LIGHTS: CLICK HANDLERS ----------
    lightsModeAutoBtn.addEventListener("click", function(){
      lightsModeRef.set("AUTO");
      addWiggle(lightsModeAutoBtn);
    });
    lightsModeManualBtn.addEventListener("click", function(){
      lightsModeRef.set("MANUAL");
      addWiggle(lightsModeManualBtn);
    });
    lightsOnBtn.addEventListener("click", function(){
      lightsCmdRef.set("ON");
      addWiggle(lightsOnBtn);
    });
    lightsOffBtn.addEventListener("click", function(){
      lightsCmdRef.set("OFF");
      addWiggle(lightsOffBtn);
    });

    // ---------- PLANT STATE ----------
    var PLANT_MAX_STAGE = 10;         // 1..10 live stages
    var PLANT_FINAL_SRC = "11.png";   // celebration frame
    var plantLevel = 1;
    var prevPlantLevel = 1;
    var lastGrowthReason = "water";
    var lastPumpState = null;
    var lastLightsState = null;

    function baseAngleForStage(stage) {
      return (stage % 2 === 0 ? 2.4 : -2.4);
    }

    function applyPlantTransform(angleDeg, bump) {
      if (!plantImgEl) return;
      var t = "rotate(" + angleDeg + "deg)";
      if (bump) {
        t = "translateY(-6px) scale(1.06) " + t;
      }
      plantImgEl.style.transform = t;
    }

    function updatePlantVisual(bump) {
      var stage = Math.max(1, Math.min(PLANT_MAX_STAGE, plantLevel));
      plantLevelEl.textContent = stage;
      if (!plantImgEl) return;

      plantImgEl.src = stage + ".png";
      var angle = baseAngleForStage(stage);
      applyPlantTransform(angle, !!bump);

      if (bump) {
        setTimeout(function(){
          applyPlantTransform(angle, false);
        }, 260);
      }
    }

    plantLevelRef.on("value", function(snap){
      var v = snap.val();
      prevPlantLevel = plantLevel;

      if (typeof v === "number") {
        plantLevel = v;
      } else {
        plantLevel = 1;
      }
      updatePlantVisual(true);

      // If we just reached max for the first time, play finale automatically
      if (plantLevel === PLANT_MAX_STAGE && prevPlantLevel < PLANT_MAX_STAGE) {
        setTimeout(function(){
          finaleCelebration(lastGrowthReason);
        }, 600); // show stage 10 briefly first
      }
    });

    plantResetEl.addEventListener("click", function(e){
      e.preventDefault();
      plantLevelRef.set(1);
    });

    function triggerLightEffect() {
      if (!lightFxEl) return;
      lightFxEl.classList.remove("light-anim");
      void lightFxEl.offsetWidth;
      lightFxEl.classList.add("light-anim");
    }
    function triggerWaterEffect() {
      if (!waterFxEl) return;
      waterFxEl.classList.remove("water-anim");
      void waterFxEl.offsetWidth;
      waterFxEl.classList.add("water-anim");
    }
    function triggerSparkles() {
      if (!sparkleEl) return;
      sparkleEl.classList.remove("sparkle-anim");
      void sparkleEl.offsetWidth;
      sparkleEl.classList.add("sparkle-anim");
    }

    function finaleCelebration(reason) {
      if (!plantImgEl) return;
      var angle = baseAngleForStage(PLANT_MAX_STAGE);
      plantImgEl.src = PLANT_FINAL_SRC;
      applyPlantTransform(angle, true);

      if (reason === "light") triggerLightEffect();
      if (reason === "water") triggerWaterEffect();
      triggerSparkles();

      // after party, reset level in DB (which will also refresh the image)
      setTimeout(function(){
        plantLevelRef.set(1);
      }, 1100);
    }

    function growPlant(reason) {
      lastGrowthReason = reason || lastGrowthReason || "water";

      if (plantLevel < PLANT_MAX_STAGE) {
        // increment — listener will handle visuals & possible finale
        plantLevelRef.set(plantLevel + 1);

        if (reason === "light") triggerLightEffect();
        if (reason === "water") triggerWaterEffect();
      } else {
        // already at max, trigger celebration again on extra hits
        finaleCelebration(lastGrowthReason);
      }
    }

    // ---------- WATER (PUMP): LIVE UPDATES ----------
    pumpModeRef.on("value", function(snap){
      var m = snap.val() || "AUTO";
      pumpModeText.textContent = m;

      pumpModeAutoBtn.classList.toggle("selected", m === "AUTO");
      pumpModeManualBtn.classList.toggle("selected", m === "MANUAL");

      var manual = (m === "MANUAL");
      [pumpOnBtn, pumpOffBtn].forEach(function(btn){
        if (manual) btn.classList.remove("disabled");
        else btn.classList.add("disabled");
      });
    });

    pumpStateRef.on("value", function(snap){
      var v = snap.val() || "OFF";
      pumpStateText.textContent = v;
      pumpStateText.classList.remove("state-on","state-off");
      pumpStateText.classList.add(v === "ON" ? "state-on" : "state-off");

      pumpOnBtn.classList.toggle("selected", v === "ON");
      pumpOffBtn.classList.toggle("selected", v === "OFF");

      if (lastPumpState !== "ON" && v === "ON") {
        growPlant("water");
      }
      lastPumpState = v;
    });

    drynessRef.on("value", function(snap){
      var v = snap.val();
      if (typeof v === "number") drynessText.textContent = v + "%";
      else drynessText.textContent = "–%";
    });

    // ---------- LIGHTS: LIVE UPDATES ----------
    lightsModeRef.on("value", function(snap){
      var m = snap.val() || "AUTO";
      lightsModeText.textContent = m;

      lightsModeAutoBtn.classList.toggle("selected", m === "AUTO");
      lightsModeManualBtn.classList.toggle("selected", m === "MANUAL");

      var manual = (m === "MANUAL");
      [lightsOnBtn, lightsOffBtn].forEach(function(btn){
        if (manual) btn.classList.remove("disabled");
        else btn.classList.add("disabled");
      });
    });

    lightsStateRef.on("value", function(snap){
      var v = snap.val() || "OFF";
      lightsStateText.textContent = v;
      lightsStateText.classList.remove("state-on","state-off");
      lightsStateText.classList.add(v === "ON" ? "state-on" : "state-off");

      lightsOnBtn.classList.toggle("selected", v === "ON");
      lightsOffBtn.classList.toggle("selected", v === "OFF");

      if (lastLightsState !== "ON" && v === "ON") {
        growPlant("light");
      }
      lastLightsState = v;
    });

    // ---------- DRAGGABLE CARDS (transform-based, no layout changes) ----------
    (function() {
      var draggables = Array.prototype.slice.call(
        document.querySelectorAll(".draggable")
      );
      var zCounter = 5;

      draggables.forEach(function(card) {
        var handle;

        if (card.id === "plant-panel") {
          // plant panel: use plantWrapper as handle
          handle = document.getElementById("plantWrapper");
        } else {
          handle = card.querySelector(".draggable-handle") || card;
        }

        var offsetX = 0;
        var offsetY = 0;
        var startX, startY;
        var dragging = false;

        handle.addEventListener("mousedown", function(e) {
          if (e.button !== 0) return; // left click only
          e.preventDefault();

          dragging = true;
          if (card.id === "plant-panel") {
            handle.classList.add("dragging");
          } else {
            card.classList.add("dragging");
          }
          card.style.zIndex = ++zCounter;

          startX = e.clientX;
          startY = e.clientY;

          // read current translate if any
          var st = window.getComputedStyle(card);
          var m = new WebKitCSSMatrix(st.transform);
          offsetX = m.m41;
          offsetY = m.m42;

          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });

        function onMove(e) {
          if (!dragging) return;
          var dx = e.clientX - startX;
          var dy = e.clientY - startY;
          var tx = offsetX + dx;
          var ty = offsetY + dy;
          card.style.transform = "translate(" + tx + "px," + ty + "px)";
        }

        function onUp() {
          if (!dragging) return;
          dragging = false;
          card.classList.remove("dragging");
          if (card.id === "plant-panel") {
            handle.classList.remove("dragging");
          }
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
        }
      });

      // organize me: reset transforms → back to clean 3-column layout
      var organizeBtn = document.getElementById("organizeBtn");
      if (organizeBtn) {
        organizeBtn.addEventListener("click", function() {
          draggables.forEach(function(card) {
            card.style.transform = "translate(0px,0px)";
            card.style.zIndex = "";
          });
        });
      }
    })();
  </script>
</body>
</html>
